<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InvoiceDesk | Freelance Ledger</title>
  <style>
    :root { --bg: oklch(96% .012 245); --panel: oklch(99% .007 245); --line: oklch(86% .022 245); --ink: oklch(23% .03 250); --muted: oklch(50% .04 250); --accent: oklch(47% .14 230); --soft: oklch(93% .04 230); --paid: oklch(48% .14 150); --late: oklch(55% .17 28); }
    * { box-sizing: border-box; } body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    main { width: min(1220px, calc(100% - 32px)); margin: 28px auto 40px; } header { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
    h1 { margin: 0 0 6px; font-size: 28px; } h2 { margin: 0 0 8px; font-size: 17px; } p { margin: 0; color: var(--muted); }
    button, input, select, textarea { font: inherit; border-radius: 8px; } button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 12px; cursor: pointer; } button.primary { background: var(--accent); color: oklch(98% .01 230); border-color: var(--accent); }
    input, select, textarea { width: 100%; border: 1px solid var(--line); background: oklch(100% .004 245); padding: 10px; color: var(--ink); } textarea { min-height: 70px; resize: vertical; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; } .grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
    form, section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; } form { display: grid; gap: 12px; } label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; } .stat { background: var(--soft); border-radius: 8px; padding: 12px; } .stat b { display: block; font-size: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; } .tabs button.active { border-color: var(--accent); color: var(--accent); background: var(--soft); }
    .list { display: grid; gap: 10px; } .item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; } .top { display: flex; justify-content: space-between; gap: 10px; }
    .name { font-size: 16px; font-weight: 750; } .meta { color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; } .pill { width: fit-content; border-radius: 999px; padding: 4px 8px; background: var(--soft); color: var(--accent); font-size: 12px; font-weight: 750; } .paid { color: var(--paid); } .late { color: var(--late); font-weight: 750; }
    .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; }
    @media (max-width: 820px) { main { width: min(100% - 20px, 1220px); margin-top: 18px; } header, .grid, .row { display: grid; grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>InvoiceDesk</h1><p>Track clients, billable time, expenses, and simple invoice status without a monthly billing tool.</p></div><div class="actions"><button id="exportBtn">Export JSON</button><button id="csvBtn">Export CSV</button><button id="importBtn">Import</button><input id="importFile" type="file" accept="application/json" hidden></div></header>
    <div class="grid">
      <form id="entryForm"><h2>Add billable entry</h2><label>Client <input name="client" required placeholder="Acme Studio"></label><label>Description <textarea name="description" required placeholder="Landing page revisions"></textarea></label><div class="row"><label>Hours <input name="hours" type="number" step="0.25" min="0" value="1"></label><label>Rate <input name="rate" type="number" step="1" min="0" value="75"></label></div><div class="row"><label>Expense <input name="expense" type="number" step="0.01" min="0" value="0"></label><label>Date <input name="date" type="date" required></label></div><div class="row"><label>Due date <input name="due" type="date" required></label><label>Status <select name="status"><option>Draft</option><option>Sent</option><option>Paid</option></select></label></div><button class="primary">Save entry</button></form>
      <section><div class="stats" id="stats"></div><div class="tabs" id="tabs"><button data-tab="all" class="active">All</button><button data-tab="draft">Draft</button><button data-tab="sent">Sent</button><button data-tab="paid">Paid</button><button data-tab="late">Late</button></div><div class="list" id="list"></div></section>
    </div>
  </main>
  <script>
    const key = "invoicedesk:v1";
    const today = () => new Date().toISOString().slice(0,10);
    const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
    let entries = JSON.parse(localStorage.getItem(key) || "null") || [
      { id: crypto.randomUUID(), client: "Northstar Co", description: "Strategy workshop", hours: 3, rate: 125, expense: 0, date: today(), due: addDays(14), status: "Sent" },
      { id: crypto.randomUUID(), client: "Bright Goods", description: "Product page copy", hours: 5.5, rate: 90, expense: 18, date: today(), due: addDays(21), status: "Draft" }
    ];
    const form = document.querySelector("#entryForm"), stats = document.querySelector("#stats"), list = document.querySelector("#list"), tabs = document.querySelector("#tabs"), importFile = document.querySelector("#importFile");
    let activeTab = "all"; form.date.value = today(); form.due.value = addDays(14);
    const money = n => n.toLocaleString(undefined, { style: "currency", currency: "USD" });
    const amount = e => Number(e.hours) * Number(e.rate) + Number(e.expense || 0);
    const late = e => e.status !== "Paid" && new Date(e.due) < new Date(new Date().toDateString());
    function save() { localStorage.setItem(key, JSON.stringify(entries)); render(); }
    form.onsubmit = e => { e.preventDefault(); const data = Object.fromEntries(new FormData(form)); entries.push({ id: crypto.randomUUID(), ...data, hours: Number(data.hours), rate: Number(data.rate), expense: Number(data.expense) }); form.reset(); form.date.value = today(); form.due.value = addDays(14); save(); };
    tabs.onclick = e => { if (!e.target.dataset.tab) return; activeTab = e.target.dataset.tab; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab)); render(); };
    document.querySelector("#exportBtn").onclick = () => download("invoicedesk-data.json", JSON.stringify(entries, null, 2), "application/json");
    document.querySelector("#csvBtn").onclick = () => download("invoicedesk-entries.csv", csv(), "text/csv");
    document.querySelector("#importBtn").onclick = () => importFile.click();
    importFile.onchange = async () => { entries = JSON.parse(await importFile.files[0].text()); save(); };
    function download(name, text, type) { const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([text], { type })), download: name }); a.click(); URL.revokeObjectURL(a.href); }
    function csv() { return ["Client,Description,Hours,Rate,Expense,Date,Due,Status,Amount", ...entries.map(e => [e.client, e.description, e.hours, e.rate, e.expense, e.date, e.due, e.status, amount(e)].map(v => `"${String(v).replaceAll('"','""')}"`).join(","))].join("\n"); }
    function render() {
      const unpaid = entries.filter(e => e.status !== "Paid"), paid = entries.filter(e => e.status === "Paid");
      stats.innerHTML = [["Unbilled", money(entries.filter(e => e.status === "Draft").reduce((t,e) => t + amount(e), 0))], ["Outstanding", money(unpaid.filter(e => e.status === "Sent").reduce((t,e) => t + amount(e), 0))], ["Collected", money(paid.reduce((t,e) => t + amount(e), 0))], ["Late", unpaid.filter(late).length]].map(([l,v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
      const rows = entries.filter(e => activeTab === "all" ? true : activeTab === "late" ? late(e) : e.status.toLowerCase() === activeTab).sort((a,b) => new Date(b.date) - new Date(a.date));
      list.innerHTML = rows.length ? rows.map(e => `<article class="item"><div class="top"><div><div class="name">${e.client}</div><div class="meta"><span>${e.description}</span><span>${e.hours}h at ${money(Number(e.rate))}</span><span>${money(amount(e))}</span><span class="${late(e) ? "late" : ""}">due ${e.due}</span></div></div><span class="pill ${e.status === "Paid" ? "paid" : ""}">${e.status}</span></div><div class="actions"><button onclick="setStatus('${e.id}','Draft')">Draft</button><button onclick="setStatus('${e.id}','Sent')">Sent</button><button onclick="setStatus('${e.id}','Paid')">Paid</button><button onclick="removeEntry('${e.id}')">Delete</button></div></article>`).join("") : `<div class="empty">No entries in this view. Log time on the left and move it from draft to paid.</div>`;
    }
    window.setStatus = (id, status) => { entries = entries.map(e => e.id === id ? { ...e, status } : e); save(); };
    window.removeEntry = id => { entries = entries.filter(e => e.id !== id); save(); };
    render();
  </script>
</body>
</html>
